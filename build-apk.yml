name: Zbuduj APK

# Buduje przy każdym pushu do main oraz na żądanie
# (zakładka Actions -> "Zbuduj APK" -> przycisk "Run workflow").
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3

      - name: Przygotuj Gradle (z cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Nadaj prawa wykonywania
        run: chmod +x gradlew

      - name: Zbuduj APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Wrzuć APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: pogoda-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
